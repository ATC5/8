<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>القرعة العشوائية - تشكيل التحالفات</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&display=swap');
        body { margin: 0; padding: 20px; font-family: 'Tajawal', sans-serif; color: #ffffff; background-color: #000103; background-image: radial-gradient(circle at 50% 50%, #0a1128 0%, #000 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow-y: auto; overflow-x: hidden; box-sizing: border-box; }
        .stars-container { position: fixed; inset: 0; z-index: -2; pointer-events: none; }
        .star { position: absolute; background: #fff; border-radius: 50%; opacity: 0.5; }
        .star-fast { animation: fall 15s linear infinite; } .star-slow { animation: fall 35s linear infinite; }
        @keyframes fall { from { transform: translateY(-10vh); } to { transform: translateY(110vh); } }
        .header { text-align: center; margin-bottom: 20px; z-index: 10; }
        .header h1 { font-size: 2.5rem; color: #38bdf8; margin: 0; text-shadow: 0 0 20px rgba(56, 189, 248, 0.5); font-weight: 900; }
        .header p { font-size: 1.1rem; color: #94a3b8; margin-top: 5px; }
        .teams-container { display: flex; gap: 15px; justify-content: center; width: 100%; max-width: 1200px; z-index: 10; flex-wrap: wrap; }
        .team-card { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 15px; padding: 15px; flex: 1; min-width: 220px; text-align: center; box-shadow: 0 10px 20px rgba(0,0,0,0.5); opacity: 0; transform: translateY(30px); transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .team-card.revealed { opacity: 1; transform: translateY(0); }
        .team-icon { font-size: 2.5rem; margin-bottom: 5px; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.5)); }
        .team-name { font-size: 1.4rem; font-weight: 900; margin-bottom: 15px; border-bottom: 2px dashed rgba(255,255,255,0.2); padding-bottom: 10px;}
        .team-apollo { color: #fbbf24; box-shadow: inset 0 0 20px rgba(251, 191, 36, 0.1); border-color: rgba(251, 191, 36, 0.3);}
        .team-voyager { color: #38bdf8; box-shadow: inset 0 0 20px rgba(56, 189, 248, 0.1); border-color: rgba(56, 189, 248, 0.3);}
        .team-artemis { color: #4ade80; box-shadow: inset 0 0 20px rgba(74, 222, 128, 0.1); border-color: rgba(74, 222, 128, 0.3);}
        .team-orion { color: #f43f5e; box-shadow: inset 0 0 20px rgba(244, 63, 94, 0.1); border-color: rgba(244, 63, 94, 0.3);}
        .student-slot { background: rgba(0,0,0,0.5); margin: 8px 0; padding: 10px; border-radius: 10px; font-size: 1.1rem; font-weight: 700; color: #f8fafc; display: flex; align-items: center; justify-content: center; border: 1px solid transparent; min-height: 20px; transition: 0.3s; }
        .controls { margin-top: 30px; z-index: 10; display: flex; gap: 15px; }
        .btn { padding: 12px 30px; font-size: 1.2rem; font-weight: 900; border-radius: 50px; cursor: pointer; font-family: 'Tajawal', sans-serif; border: none; transition: 0.3s; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        #start-draw { background: linear-gradient(135deg, #d4af37, #b8860b); color: #000; }
        #start-draw:hover { transform: translateY(-5px); background: linear-gradient(135deg, #f5d76e, #d4af37); }
        #start-draw:disabled { background: #334155; color: #64748b; cursor: not-allowed; transform: none; box-shadow: none; }
        #next-round { background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: #fff; display: none; text-decoration: none;}
        #next-round:hover { transform: translateY(-5px); background: linear-gradient(135deg, #60a5fa, #3b82f6); }
        .spinner { animation: spinColor 0.1s infinite alternate; }
        @keyframes spinColor { 0% { color: #94a3b8; } 100% { color: #fff; } }
    </style>
</head>
<body>
    <div class="stars-container" id="stars-js"></div>
    <div class="header">
        <h1>توزيع التحالفات الفضائية</h1>
        <p>جاري تحديد مسارات رواد الفضاء...</p>
    </div>
    <div class="teams-container">
        <div class="team-card team-apollo" id="team-1">
            <div class="team-icon">🚀</div>
            <div class="team-name">فريق أبولو</div>
            <div class="student-slot" id="t1-s1">?</div>
            <div class="student-slot" id="t1-s2">?</div>
            <div class="student-slot" id="t1-s3">?</div>
        </div>
        <div class="team-card team-voyager" id="team-2">
            <div class="team-icon">🛰️</div>
            <div class="team-name">فريق فوياجر</div>
            <div class="student-slot" id="t2-s1">?</div>
            <div class="student-slot" id="t2-s2">?</div>
            <div class="student-slot" id="t2-s3">?</div>
        </div>
        <div class="team-card team-artemis" id="team-3">
            <div class="team-icon">🌙</div>
            <div class="team-name">فريق أرتيميس</div>
            <div class="student-slot" id="t3-s1">?</div>
            <div class="student-slot" id="t3-s2">?</div>
            <div class="student-slot" id="t3-s3">?</div>
        </div>
        <div class="team-card team-orion" id="team-4">
            <div class="team-icon">☄️</div>
            <div class="team-name">فريق أوريون</div>
            <div class="student-slot" id="t4-s1">?</div>
            <div class="student-slot" id="t4-s2">?</div>
            <div class="student-slot" id="t4-s3">?</div>
        </div>
    </div>
    <div class="controls">
        <button id="start-draw" class="btn" onclick="startDraw()">إجراء القرعة 🎲</button>
        <a id="next-round" href="round1.html" class="btn">الانتقال إلى الجولة الأولى ➔</a>
    </div>

    <script>
        const container = document.getElementById('stars-js');
        for (let i = 0; i < 60; i++) {
            const star = document.createElement('div');
            const isFast = i < 20;
            star.className = `star ${isFast ? 'star-fast' : 'star-slow'}`;
            star.style.width = (isFast ? 2 : 1) + 'px';
            star.style.height = star.style.width;
            star.style.left = Math.random() * 100 + 'vw';
            star.style.top = Math.random() * 100 + 'vh';
            star.style.animationDelay = -(Math.random() * 40) + 's';
            container.appendChild(star);
        }

        setTimeout(() => document.getElementById('team-1').classList.add('revealed'), 100);
        setTimeout(() => document.getElementById('team-2').classList.add('revealed'), 300);
        setTimeout(() => document.getElementById('team-3').classList.add('revealed'), 500);
        setTimeout(() => document.getElementById('team-4').classList.add('revealed'), 700);

        const students = [
            "يوسف سداد", "ساره ولام", "سارة ابراهيم", 
            "عبدالله عبد المحسن", "قاسم محمد", "زينب احمد", 
            "ساره اياد", "حسين عباس", "ياسر مؤيد", 
            "طالب 10", "طالب 11", "طالب 12"
        ];
        
        const tickSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3');
        const winSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3');

        function startDraw() {
            const btn = document.getElementById('start-draw');
            btn.disabled = true;
            btn.innerText = "جاري اختيار الفرق...";

            let shuffled = [...students].sort(() => Math.random() - 0.5);
            
            const slots = [
                document.getElementById('t1-s1'), document.getElementById('t1-s2'), document.getElementById('t1-s3'),
                document.getElementById('t2-s1'), document.getElementById('t2-s2'), document.getElementById('t2-s3'),
                document.getElementById('t3-s1'), document.getElementById('t3-s2'), document.getElementById('t3-s3'),
                document.getElementById('t4-s1'), document.getElementById('t4-s2'), document.getElementById('t4-s3')
            ];

            let currentSlotIndex = 0;

            function rollName() {
                if (currentSlotIndex >= slots.length) {
                    winSound.play();
                    btn.style.display = 'none';
                    document.getElementById('next-round').style.display = 'inline-block';
                    
                    // حفظ الفرق في الذاكرة حتى تقرأها الجولات الباقية
                    const teamAssignments = {};
                    shuffled.forEach((student, index) => {
                        if(index < 3) teamAssignments[student] = { name: "أبولو", icon: "🚀", color: "#fbbf24" };
                        else if(index < 6) teamAssignments[student] = { name: "فوياجر", icon: "🛰️", color: "#38bdf8" };
                        else if(index < 9) teamAssignments[student] = { name: "أرتيميس", icon: "🌙", color: "#4ade80" };
                        else teamAssignments[student] = { name: "أوريون", icon: "☄️", color: "#f43f5e" };
                    });
                    localStorage.setItem('teamAssignments', JSON.stringify(teamAssignments));
                    
                    return;
                }

                const slot = slots[currentSlotIndex];
                slot.classList.add('spinner');
                let spinCount = 0;

                const spinInterval = setInterval(() => {
                    slot.innerText = students[Math.floor(Math.random() * students.length)];
                    tickSound.currentTime = 0;
                    tickSound.play().catch(e=>{});
                    spinCount++;

                    if (spinCount > 15) { 
                        clearInterval(spinInterval);
                        slot.classList.remove('spinner');
                        slot.innerText = shuffled[currentSlotIndex]; 
                        slot.style.borderColor = "rgba(255,255,255,0.5)";
                        slot.style.boxShadow = "0 0 15px rgba(255,255,255,0.2)";
                        currentSlotIndex++;
                        setTimeout(rollName, 400); 
                    }
                }, 50);
            }
            rollName();
        }
    </script>
</body>
</html>
