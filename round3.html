<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المسابقة الكبرى - السباق النهائي</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');
        
        :root {
            --gold: #fbbf24; --silver: #cbd5e1; --bronze: #f97316;
            --bg-dark: #010409; --neon-blue: #38bdf8;
        }

        body {
            margin: 0; padding: 20px 0; font-family: 'Tajawal', sans-serif; color: #ffffff;
            background-color: var(--bg-dark);
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            min-height: 100vh; overflow-y: auto; overflow-x: hidden; box-sizing: border-box; gap: 15px;
        }

        .stars-container { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
        .star { position: absolute; background: #fff; border-radius: 50%; top: -10vh; }
        @keyframes moveDownStars { 0% { transform: translateY(0vh); } 100% { transform: translateY(110vh); } }

        .cockpit-window {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: 99;
            box-shadow: inset 0 0 80px rgba(0,0,0,0.9), inset 0 0 150px rgba(15, 23, 42, 0.8);
            border: 15px solid #060b14; border-radius: 40px; box-sizing: border-box;
        }

        .top-bar { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 10px 40px; z-index: 10; box-sizing: border-box; }
        .logos img { height: 55px; filter: drop-shadow(0 0 15px rgba(56,189,248,0.4)); }
        
        .header-titles { text-align: center; flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; background: rgba(2, 6, 23, 0.8); padding: 10px 30px; border-radius: 20px; border: 1px solid rgba(56, 189, 248, 0.3); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .header-titles h1 { font-size: 2.2rem; margin: 0; font-weight: 900; color: #ffffff; }
        .header-titles p { font-size: 1rem; color: #cbd5e1; margin: 0; }

        .sidebar { display: flex; gap: 10px; background: rgba(15, 23, 42, 0.8); padding: 8px; border-radius: 12px; }
        .nav-btn { color: #94a3b8; padding: 10px 15px; text-decoration: none; font-weight: 700; border-radius: 8px; font-size: 0.9rem; transition: 0.3s; }
        .nav-btn.active { background: var(--neon-blue); color: #020617; }
        .nav-btn:hover { background: rgba(56, 189, 248, 0.2); color: #fff; }

        .moderator-panel { z-index: 10; display: flex; align-items: center; justify-content: center; gap: 20px; background: rgba(15, 23, 42, 0.9); padding: 10px 30px; border-radius: 50px; border: 1px solid var(--neon-blue); margin-top: 5px; box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);}
        .timer-label { font-size: 1rem; color: var(--neon-blue); font-weight: 700; }
        .timer-display { font-size: 2rem; font-weight: 900; color: #fff; min-width: 60px; text-align: center; line-height: 1; }
        .start-timer-btn { background: transparent; color: var(--neon-blue); border: 2px solid var(--neon-blue); padding: 8px 20px; border-radius: 20px; font-weight: 900; cursor: pointer; transition: 0.3s;}
        .start-timer-btn:hover { background: var(--neon-blue); color: #000; }
        
        .race-arena { width: 90%; max-width: 1200px; min-height: 500px; flex-grow: 1; background: rgba(2, 6, 23, 0.6); border: 2px solid rgba(56, 189, 248, 0.3); border-radius: 20px; position: relative; display: flex; justify-content: space-evenly; padding-bottom: 100px; overflow: hidden; box-shadow: inset 0 0 50px rgba(56,189,248,0.1); }
        .finish-line-container { position: absolute; top: 30px; left: 0; width: 100%; height: 30px; z-index: 2; display: flex; justify-content: center; align-items: center; border-bottom: 3px dashed #4ade80; background: linear-gradient(90deg, transparent, rgba(74, 222, 128, 0.1), transparent);}
        .finish-text { color: #4ade80; font-weight: 900; font-size: 1.5rem; text-shadow: 0 0 10px #4ade80;}
        
        .lane { position: relative; width: 25%; height: 100%; display: flex; justify-content: center; border-left: 1px solid rgba(56,189,248,0.1); border-right: 1px solid rgba(56,189,248,0.1); background: linear-gradient(180deg, rgba(56,189,248,0.01), rgba(56,189,248,0.05)); }
        .rocket-wrapper { position: absolute; bottom: 0; width: 80px; height: 120px; display: flex; flex-direction: column; align-items: center; transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); z-index: 10; }
        .rocket-svg { width: 100%; height: 100%; filter: drop-shadow(0 10px 10px rgba(0,0,0,0.8));}
        
        .launchpad { position: absolute; bottom: 0; width: 100%; padding: 15px 0; background: rgba(15,23,42,0.95); border-top: 1px solid rgba(56, 189, 248, 0.3); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 30; }
        .player-name { font-size: 1.2rem; font-weight: 900; color: #fff; margin-bottom: 5px; text-shadow: 0 2px 4px rgba(0,0,0,0.8);}
        .player-rank { font-size: 0.85rem; font-weight: 700; padding: 4px 12px; border-radius: 15px; }

        .rank-gold .player-rank { background: rgba(251, 191, 36, 0.15); color: var(--gold); border: 1px solid var(--gold); }
        .rank-silver .player-rank { background: rgba(203, 213, 225, 0.15); color: var(--silver); border: 1px solid var(--silver); }
        .rank-bronze .player-rank { background: rgba(249, 115, 22, 0.15); color: var(--bronze); border: 1px solid var(--bronze); }
        .rank-gold .rocket-svg path.body { fill: #fef08a; } .rank-gold .rocket-svg path.fin { fill: #b45309; }
        .rank-silver .rocket-svg path.body { fill: #f1f5f9; } .rank-silver .rocket-svg path.fin { fill: #475569; }
        .rank-bronze .rocket-svg path.body { fill: #fdba74; } .rank-bronze .rocket-svg path.fin { fill: #9a3412; }

        .controls-panel { width: 90%; max-width: 1200px; padding: 20px 30px; background: rgba(2, 6, 23, 0.9); border-radius: 20px; z-index: 100; border: 1px solid rgba(56, 189, 248, 0.3); display: flex; justify-content: center; gap: 30px; box-sizing: border-box; box-shadow: 0 10px 30px rgba(0,0,0,0.8);}
        .btn-launch { flex: 1; max-width: 300px; padding: 15px 20px; border-radius: 15px; border: 2px solid; background: rgba(15, 23, 42, 0.9); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: space-between; transition: 0.2s; box-shadow: inset 0 0 15px rgba(0,0,0,0.5);}
        .btn-launch:active { transform: translateY(4px); }
        .btn-launch .btn-key { background: rgba(56,189,248,0.2); padding: 5px 12px; border-radius: 8px; font-weight: 900; color: var(--neon-blue);}
        .btn-launch .btn-name { font-size: 1.2rem; font-weight: 900; }
        .btn-gold { border-color: rgba(251, 191, 36, 0.5); color: var(--gold); }
        .btn-silver { border-color: rgba(203, 213, 225, 0.5); color: var(--silver); }
        .btn-bronze { border-color: rgba(249, 115, 22, 0.5); color: var(--bronze); }

        #victory-overlay { position: fixed; inset: 0; background: rgba(2, 6, 23, 0.95); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; backdrop-filter: blur(10px);}
        .victory-title { font-size: 3rem; font-weight: 900; background: linear-gradient(to right, #fbbf24, #fff, #fbbf24); -webkit-background-clip: text; color: transparent; margin-bottom: 40px; text-shadow: 0 0 30px rgba(251, 191, 36, 0.5);}
        .podium-container { display: flex; align-items: flex-end; gap: 30px; height: 350px; }
        .podium-card { background: linear-gradient(145deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 1)); border: 2px solid transparent; border-radius: 20px; padding: 30px 20px; display: flex; flex-direction: column; align-items: center; width: 200px; box-shadow: 0 20px 40px rgba(0,0,0,0.8);}
        .podium-gold { height: 300px; border-color: var(--gold); box-shadow: 0 0 50px rgba(251, 191, 36, 0.4);}
        .podium-silver { height: 240px; border-color: var(--silver); }
        .podium-bronze { height: 180px; border-color: var(--bronze); }
        .medal-img { font-size: 4.5rem; margin-bottom: 15px; }
        .winner-name { font-size: 1.6rem; font-weight: 900; color: #fff; text-align: center;}

        @media (max-width: 1024px) { .top-bar { flex-direction: column; gap: 15px; } .logos { display: none; } .controls-panel { flex-direction: column; } .btn-launch { max-width: 100%; } }
    </style>
</head>
<body>

    <div class="cockpit-window"></div>
    <div class="stars-container" id="stars-bg"></div>

    <div class="top-bar">
        <div class="logos"><img src="IMG/UOT2.PNG" alt="شعار القسم"></div>
        <div class="header-titles">
            <h1>السباق الحاسم</h1>
            <p>الجولة النهائية لأبطال قسم هندسة الملاحة والتوجيه</p>
        </div>
        <div class="sidebar">
            <a href="index.html" class="nav-btn" style="background: rgba(255,255,255,0.1); border: 1px solid #fff;">العودة للقرعة 🎲</a>
            <a href="round1.html" class="nav-btn">الأسئلة</a>
            <a href="round2.html" class="nav-btn">الصور</a>
            <a href="round3.html" class="nav-btn active">السباق</a>
        </div>
    </div>

    <div class="moderator-panel">
        <span class="timer-label">المؤقت:</span>
        <div id="q-timer" class="timer-display">--</div>
        <button class="start-timer-btn" onclick="startQuestionTimer()">ابدأ المؤقت</button>
    </div>

    <div class="race-arena">
        <div class="finish-line-container"><div class="finish-text">خط النهاية 🎯</div></div>
        
        <div class="lane">
            <div class="rocket-wrapper rank-gold" id="rocket-0">
                <svg class="rocket-svg" viewBox="0 0 80 140" fill="none">
                    <path class="fin" d="M20 80L0 120H24V80H20Z"/><path class="fin" d="M60 80L80 120H56V80H60Z"/>
                    <path class="body" d="M40 0C40 0 16 35 20 80V110H60V80C64 35 40 0 40 0Z"/>
                </svg>
            </div>
            <div class="launchpad rank-gold"><div class="player-name" id="name-0">---</div><div class="player-rank">المركز الأول</div></div>
        </div>

        <div class="lane">
            <div class="rocket-wrapper rank-silver" id="rocket-1">
                <svg class="rocket-svg" viewBox="0 0 80 140" fill="none">
                    <path class="fin" d="M20 80L0 120H24V80H20Z"/><path class="fin" d="M60 80L80 120H56V80H60Z"/>
                    <path class="body" d="M40 0C40 0 16 35 20 80V110H60V80C64 35 40 0 40 0Z"/>
                </svg>
            </div>
            <div class="launchpad rank-silver"><div class="player-name" id="name-1">---</div><div class="player-rank">المركز الثاني</div></div>
        </div>

        <div class="lane">
            <div class="rocket-wrapper rank-bronze" id="rocket-2">
                <svg class="rocket-svg" viewBox="0 0 80 140" fill="none">
                    <path class="fin" d="M20 80L0 120H24V80H20Z"/><path class="fin" d="M60 80L80 120H56V80H60Z"/>
                    <path class="body" d="M40 0C40 0 16 35 20 80V110H60V80C64 35 40 0 40 0Z"/>
                </svg>
            </div>
            <div class="launchpad rank-bronze"><div class="player-name" id="name-2">---</div><div class="player-rank">المركز الثالث</div></div>
        </div>
    </div>

    <div class="controls-panel">
        <button class="btn-launch btn-gold" onclick="launchRocket(0)"><span class="btn-name" id="btn-name-0">---</span><span class="btn-key">مسافة (1)</span></button>
        <button class="btn-launch btn-silver" onclick="launchRocket(1)"><span class="btn-name" id="btn-name-1">---</span><span class="btn-key">مسافة (2)</span></button>
        <button class="btn-launch btn-bronze" onclick="launchRocket(2)"><span class="btn-name" id="btn-name-2">---</span><span class="btn-key">مسافة (3)</span></button>
    </div>

    <div id="victory-overlay">
        <div class="victory-title">أبطال قسم هندسة الملاحة والتوجيه</div>
        <div class="podium-container">
            <div class="podium-card podium-silver"><div class="medal-img">🥈</div><div class="winner-name" id="final-2nd">---</div></div>
            <div class="podium-card podium-gold"><div class="medal-img">🥇</div><div class="winner-name" id="final-1st">---</div></div>
            <div class="podium-card podium-bronze"><div class="medal-img">🥉</div><div class="winner-name" id="final-3rd">---</div></div>
        </div>
        <button onclick="location.reload()" style="margin-top:40px; padding:15px 40px; font-size:1.2rem; font-family:'Tajawal'; font-weight:900; background:var(--neon-blue); color:#000; border:none; border-radius:15px; cursor:pointer;">إغلاق السباق</button>
    </div>

    <script>
        const starsBg = document.getElementById('stars-bg');
        for(let i=0; i < 150; i++) {
            let star = document.createElement('div'); star.className = 'star';
            star.style.width = '2px'; star.style.height = '2px'; 
            star.style.left = Math.random() * 100 + 'vw';
            star.style.animation = `moveDownStars ${Math.random() * 15 + 10}s linear infinite`;
            starsBg.appendChild(star);
        }

        const allStudents = [
            "يوسف سداد", "ساره ولام", "سارة ابراهيم", 
            "عبدالله عبد المحسن", "قاسم محمد", "زينب احمد", 
            "ساره اياد", "حسين عباس", "ياسر مؤيد", 
            "طالب 10", "طالب 11", "طالب 12"
        ];
        
        let allScores = JSON.parse(localStorage.getItem('contestScores')) || new Array(allStudents.length).fill(0);
        let combined = allStudents.map((name, index) => ({ name, score: allScores[index] }));
        combined.sort((a, b) => b.score - a.score);
        let top3 = combined.slice(0, 3);

        top3.forEach((player, index) => {
            document.getElementById(`name-${index}`).innerText = player.name;
            document.getElementById(`btn-name-${index}`).innerText = player.name;
        });

        let rocketPositions = [0, 0, 0];
        let isRaceOver = false;
        let questionTimer = null;

        function startQuestionTimer() {
            if(isRaceOver) return;
            clearInterval(questionTimer);
            let timeLeft = 5;
            const display = document.getElementById('q-timer');
            display.innerText = `0${timeLeft}`;
            questionTimer = setInterval(() => {
                timeLeft--;
                if(timeLeft > 0) display.innerText = `0${timeLeft}`;
                else { clearInterval(questionTimer); display.innerText = "00"; }
            }, 1000);
        }

        function launchRocket(playerIndex) {
            if(isRaceOver) return;
            rocketPositions[playerIndex]++;
            const maxTravel = document.querySelector('.lane').clientHeight - 150; 
            const y = (rocketPositions[playerIndex] / 10) * maxTravel;
            document.getElementById(`rocket-${playerIndex}`).style.transform = `translate3d(0, -${y}px, 0)`;
            if (rocketPositions[playerIndex] >= 10) declareWinners();
        }

        function declareWinners() {
            isRaceOver = true; clearInterval(questionTimer);
            document.getElementById('victory-overlay').style.display = 'flex';
            document.getElementById('final-1st').innerText = top3[0].name;
            document.getElementById('final-2nd').innerText = top3[1].name;
            document.getElementById('final-3rd').innerText = top3[2].name;
        }

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !isRaceOver) { e.preventDefault(); startQuestionTimer(); }
            if (isRaceOver) return;
            if (e.key === '1') launchRocket(0); if (e.key === '2') launchRocket(1); if (e.key === '3') launchRocket(2);
        });
    </script>
</body>
</html>
